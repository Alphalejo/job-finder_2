name: Python QA Pipeline

# Trigger the workflow on every push or pull request to the main branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Pytest
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Python 3.11 (matching your project requirements)
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip" # Speeds up subsequent runs by caching dependencies

      # Step 3: Install project dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Step 4: Install Playwright and its browser binaries
      - name: Install Playwright Browsers
        run: |
          playwright install chromium

      # Step 5: Execute Pytest
      - name: Run Unit Tests
        run: |
          pytest tests/ -v
